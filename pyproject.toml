[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ep-pinhole"
version = "0.1.0"
description = "Render pinhole views from equirectangular projection images."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pillow",
    "py360convert",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest",
]
colmap= [
    "opencv-python-headless",
    "pycolmap-cuda12",
]
visualize = [
    "open3d",
    "plotly",
]

[project.scripts]
colmap-pinhole-reconstruct = "colmap.pinhole_reconstruction:main"
colmap-panorama-reconstruct = "colmap.panorama_reconstruct:main"
colmap-visualize = "colmap.visualize_map:main"
tools-sampling = "tools.sampling_dir:main"
tools-proc-video = "tools.proc_video:main"


[tool.hatch.build.targets.wheel]
packages = ["src/ep_pinhole", "src/colmap", "src/tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
