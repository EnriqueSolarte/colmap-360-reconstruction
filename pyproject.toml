[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colmap-360-reconstruction"
version = "0.1.0"
description = "Run COLMAP panorama reconstruction from equirectangular images."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pillow",
    "py360convert",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest",
]
colmap= [
    "opencv-python-headless",
    "pycolmap-cuda12",
]
visualize = [
    "open3d",
    "plotly",
]

[project.scripts]
colmap-panorama-clusters = "colmap.panorama.cli_clusters:main"
colmap-panorama-compare = "colmap.panorama.cli_compare:main"
colmap-panorama-features = "colmap.panorama.cli_features:main"
colmap-panorama-import = "colmap.panorama.cli_import:main"
colmap-panorama-reconstruct = "colmap.panorama_reconstruct:main"
colmap-pinhole-import = "colmap.pinhole.cli_import:main"
colmap-visualize = "colmap.visualize_map:main"
manual-pinhole-render-selected = "render_pinhole.tools.render_selected_pinhole:main"
manual-pinhole-attach-poses = "render_pinhole.tools.attach_pinhole_poses:main"
manual-pinhole-select = "render_pinhole.tools.manual_pinhole_select:main"
tools-sampling = "tools.sampling_dir:main"
tools-proc-video = "tools.proc_video:main"
tools-shift-panorama = "tools.shift_panorama:main"
tools-download-colmap-vocab-tree = "tools.download_colmap_vocab_tree:main"


[tool.hatch.build.targets.wheel]
packages = ["src/render_pinhole", "src/colmap", "src/tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
